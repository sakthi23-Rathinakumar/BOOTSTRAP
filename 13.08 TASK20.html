<body>

    <!-- Element Selector -->
    <h1>Element Selector</h1>
    <p>The h1 element selector makes this heading red.</p>

    <!-- Class Selector -->
    <h2 class="blue-text">Class Selector</h2>
    <p class="blue-text">
        The class selector makes these elements blue.
    </p>

    <!-- ID Selector -->
    <h2 id="special">ID Selector</h2>
    <p>
        The ID selector gives this heading a unique background and text color.
    </p>

    <!-- Universal Selector -->
    <p>
        The universal selector (*) applies the Arial font to all elements.
    </p>

</body>
