<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video and Audio</title>
</head>

<body>

    <header>
        <h1>My Multimedia Webpage</h1>
    </header>

    <main>

        <section>
            <h2>Embedded YouTube Video</h2>

            <iframe
                width="560"
                height="315"
                src="https://www.youtube.com/embed/watch?v=6PDDv_sy5Jg"
                title="YouTube video"
                allowfullscreen>
            </iframe>
        </section>

        <section>
            <h2>Audio File</h2>

            <audio controls>
                <source src="https://www.youtube.com/embed/watch?v=6PDDv_sy5Jg audio.mp3" type="audio/mpeg">
               
            </audio>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Multimedia Webpage</p>
    </footer>

</body>
</html>
