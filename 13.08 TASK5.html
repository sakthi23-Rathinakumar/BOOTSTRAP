<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"My First Web Page"</title>
</head>
<body>
    <H>REGISTRATION FORM</H>
    <BR><BR>
    <FORM>
        <LABEL>NAME:</LABEL>
        <INPUT TYPE="TEXT" NAME="NAME">

            <BR><BR>
        <LABEL>EMAIL:</LABEL> 
        <INPUT TYPE="TEXT" EMAIL="EMAIL">
            
            <BR><BR>
        <LABEL>PASSWORD:</LABEL>
        <INPUT TYPE="TEXT" PASSWORD="PASSWORD">       

            <BR><BR>
        <LABEL>GENDER:</LABEL>  
        <INPUT TYPE="RADIO" GENDER="GENDER">MALE
        <INPUT TYPE="RADIO" GENDER="GENDER">FEMALE      

            <BR><BR>
        <LABEL>HOBBIES:</LABEL>
        <INPUT TYPE="CHECKBOX" HOBBIES="HOBBIES">DRAWING
        <INPUT TYPE="CHECKBOX" HOBBIES="HOBBIES">ATHELETE
        <INPUT TYPE="CHECKBOX" HOBBIES="HOBBIES">CROCHETING

            <BR><BR>
        <INPUT TYPE="SUBMIT" VALUE="SUBMIT">
    </FORM>
</body>
</html>
